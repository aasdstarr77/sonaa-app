name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Fix missing icon
        run: |
          mkdir -p assets
          python3 -c "import base64; data=base64.b64decode('[STRIPPED 92 bytes]'); open('assets/icon.png','wb').write(data); open('assets/adaptive-icon.png','wb').write(data); open('assets/splash.png','wb').write(data); open('assets/splash-icon.png','wb').write(data)"
          ls -lh assets/

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sonaa-apk
          path: android/app/build/outputs/apk/release/app-release.apk