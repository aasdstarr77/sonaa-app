name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: sonaa-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Align Expo SDK dependencies
        run: |
          npx expo install --fix
          npm install --legacy-peer-deps

      - name: Generate branded app icons and splash assets
        run: |
          mkdir -p assets
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          out = Path("assets")
          size = 1024
          navy = "#0F172A"
          teal = "#14B8A6"
          white = "#FFFFFF"
          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          font = ImageFont.truetype(font_path, 500)

          # Standard launcher icon: navy background, teal ring, white Arabic initial.
          icon = Image.new("RGB", (size, size), navy)
          draw = ImageDraw.Draw(icon)
          draw.ellipse((140, 140, 884, 884), outline=teal, width=34)
          draw.text((512, 480), "ص", font=font, fill=white, anchor="mm", direction="rtl")
          icon.save(out / "icon.png")

          # Android adaptive foreground uses transparency; the background is set in app.json.
          foreground = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          fd = ImageDraw.Draw(foreground)
          fd.ellipse((165, 165, 859, 859), outline=teal, width=34)
          fd.text((512, 480), "ص", font=font, fill=white, anchor="mm", direction="rtl")
          foreground.save(out / "adaptive-icon.png")
          foreground.save(out / "splash-icon.png")

          Image.new("RGB", (size, size), navy).save(out / "splash.png")
          print("Generated app icon and splash assets.")
          PY

      - name: Check Expo project configuration
        run: npx expo config --type public

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sonaa-apk
          path: android/app/build/outputs/apk/release/app-release.apk
