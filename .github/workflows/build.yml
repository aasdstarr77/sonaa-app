name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Fix missing icon
        run: |
          mkdir -p assets
          echo "[STRIPPED 96 bytes]" | base64 -d > assets/icon.png
          cp assets/icon.png assets/adaptive-icon.png || true
          cp assets/icon.png assets/splash-icon.png || true
          cp assets/icon.png assets/splash.png || true
          ls -la assets/

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sonaa-apk
          path: android/app/build/outputs/apk/release/app-release.apk