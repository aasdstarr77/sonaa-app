name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Fix missing icons
        run: |
          mkdir -p assets
          pip install Pillow
          python3 -c "
          from PIL import Image
          img = Image.new('RGB', (1024, 1024), color='#0F172A')
          img.save('assets/icon.png')
          img.save('assets/adaptive-icon.png')
          img.save('assets/splash.png')
          img.save('assets/splash-icon.png')
          print('icons created')
          "

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Fix splashscreen color
        run: |
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="splashscreen_background">#0F172A</color></resources>' > android/app/src/main/res/values/splashscreen.xml
          cat android/app/src/main/res/values/splashscreen.xml
          ls android/app/src/main/res/values/

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sonaa-apk
          path: android/app/build/outputs/apk/release/app-release.apk