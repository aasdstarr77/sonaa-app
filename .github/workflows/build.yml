name: Build APK Final
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'App.js'
      - 'tests/**'
      - '.github/workflows/app-tests.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Generate app icons and splash from official logo
        run: |
          mkdir -p assets
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path("assets/LOGO_UPLOAD_HERE/logo.png")
          if not source.is_file():
              raise SystemExit("Official logo missing: assets/LOGO_UPLOAD_HERE/logo.png")
          logo = Image.open(source).convert("RGBA")
          if logo.width < 128 or logo.height < 128:
              raise SystemExit("Official logo image is unexpectedly small")
          logo = logo.resize((1024, 1024), Image.Resampling.LANCZOS)
          logo.convert("RGB").save("assets/icon.png", quality=95)
          logo.save("assets/adaptive-icon.png")
          logo.save("assets/splash-icon.png")
          logo.convert("RGB").save("assets/splash.png", quality=95)
          PY
      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean
      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: sonaa-apk-main
          path: android/app/build/outputs/apk/release/app-release.apk
