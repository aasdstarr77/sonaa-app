name: Build APK Final
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Generate branded icons
        run: |
          mkdir -p assets
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          out = Path("assets")
          size = 1024
          font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 500)
          icon = Image.new("RGB", (size, size), "#F8FAFC")
          ImageDraw.Draw(icon).ellipse((140,140,884,884), outline="#14B8A6", width=34)
          ImageDraw.Draw(icon).text((512,480), "ص", font=font, fill="#0F172A", anchor="mm")
          icon.save(out / "icon.png")
          fg = Image.new("RGBA", (size,size), (0,0,0,0))
          d=ImageDraw.Draw(fg)
          d.ellipse((165,165,859,859), outline="#14B8A6", width=34)
          d.text((512,480), "ص", font=font, fill="#0F172A", anchor="mm")
          fg.save(out / "adaptive-icon.png")
          fg.save(out / "splash-icon.png")
          Image.new("RGB", (size,size), "#F8FAFC").save(out / "splash.png")
          PY
      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean
      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: sonaa-apk-main
          path: android/app/build/outputs/apk/release/app-release.apk
