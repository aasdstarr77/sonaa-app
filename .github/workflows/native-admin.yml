name: Native Admin Android Build

on:
  push:
    paths:
      - "native-admin/**"
  pull_request:
    paths:
      - "native-admin/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build native-admin only
        run: gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: native-admin-debug-apk
          path: native-admin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
