
name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python image tools
        run: |
          python3 -m pip install --user Pillow

      - name: Create required app images
        run: |
          mkdir -p assets
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path

          Path("assets").mkdir(exist_ok=True)

          for filename, size in [
              ("icon.png", (1024, 1024)),
              ("splash.png", (1024, 1024))
          ]:
              img = Image.new("RGB", size, "#0F172A")
              draw = ImageDraw.Draw(img)
              draw.rounded_rectangle(
                  (220, 220, 804, 804),
                  radius=100,
                  fill="#2563EB"
              )
              img.save(Path("assets") / filename)

          print("Required images created.")
          PY

      - name: Install project dependencies
        run: npm install

      - name: Install Expo EAS CLI
        run: npm install --global eas-cli

      - name: Build APK with Expo EAS
        run: eas build --platform android --profile preview --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download generated APK
        run: eas build:download --platform android --latest --output ./sonaa.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Save APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonaa-apk
          path: sonaa.apk
          if-no-files-found: error
          retention-days: 7
