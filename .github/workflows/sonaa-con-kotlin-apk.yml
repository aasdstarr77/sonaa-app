name: Sonaa CON Kotlin APK
on:
  push:
    branches: [native-kotlin-con-admin]
    paths:
      - 'native-con/**'
      - '.github/workflows/sonaa-con-kotlin-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
      - name: Build native Kotlin APK
        working-directory: native-con
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sonaa-con-kotlin-debug-apk
          path: native-con/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
