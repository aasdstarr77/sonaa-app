name: App Automated Tests

on:
  push:
    branches: [ main, 'refactor/app-organization-2026-10-31' ]
    paths:
      - 'tests/**'
      - 'src/**'
      - 'App.js'
      - 'app.json'
      - 'package.json'
      - '.github/workflows/app-tests.yml'
  workflow_dispatch:

jobs:
  app-tests:
    name: Static regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install app dependencies
        run: npm install --legacy-peer-deps
      - name: Run automated tests
        run: node --test tests/*.test.js
      - name: Bundle Android JavaScript (no APK)
        run: npx expo export --platform android --output-dir /tmp/sonaa-app-export
